<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Sistemas Electrónicos de Instrumentación — FPGA y sistemas embebidos">
  <defs>
    <linearGradient id="seiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#10161f"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="seiRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e9b7a"/>
      <stop offset="100%" stop-color="#2e9b7a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seiAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fd1a0"/>
      <stop offset="100%" stop-color="#2e9b7a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="220" rx="14" fill="url(#seiBg)"/>
  <rect x="0.5" y="0.5" width="999" height="219" rx="14" fill="none" stroke="#30363d"/>
  <rect x="0" y="16" width="5" height="188" rx="2.5" fill="url(#seiAccent)"/>

  <text x="58" y="88" font-size="42" font-weight="700" fill="#e6edf3" letter-spacing="1"
